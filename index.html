<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una notte da Cicioni</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Schermata Iniziale -->
        <div id="start-screen" class="overlay active">
            <h1 class="neon-text">UNA NOTTE DA CICIONI <small
                    style="font-size: 0.5rem; vertical-align: middle; opacity: 0.7;">v2.0</small></h1>
            <div class="pub-exterior">
                <div class="neon-sign">PUB</div>
            </div>
            <p id="loading-msg">Se vedi doppio, non è un bug, è il whiskey...</p>
            <button id="start-btn" class="pixel-btn">INIZIA LA SERATA</button>

            <div id="achievements-preview" class="achievements-mini">
                <!-- Achievements will be injected here -->
            </div>
        </div>

        <!-- Interfaccia di Gioco -->
        <div id="hud" class="hidden">
            <div class="stat">
                <span>PUNTI:</span> <span id="score-val">0</span>
            </div>
            <div class="stat">
                <span>RECORD:</span> <span id="record-val">0</span>
            </div>
            <div class="stat">
                <span>EBBREZZA:</span>
                <div class="bar-container">
                    <div id="ebbrezza-bar"></div>
                </div>
            </div>
            <div id="combo-info" class="hidden">COMBO X1</div>
        </div>

        <!-- Canvas del Gioco -->
        <canvas id="game-canvas"></canvas>

        <!-- Controlli Mobile -->
        <div id="mobile-controls" class="hidden">
            <button id="jump-btn" class="touch-btn">SALTA</button>
        </div>

        <!-- Schermata Game Over -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="neon-red">GAME OVER: HAI ESAGERATO!</h2>
            <div class="game-over-visual">
                <span class="toilet">🚽</span>
                <span class="protagonist-collapsed">🤢</span>
            </div>
            <div class="final-stats">
                <p>PARTY POINTS: <span id="final-score">0</span></p>
                <p>RECORD: <span id="final-record">0</span></p>
                <p>GRADO EBBREZZA: <span id="final-ebbrezza">100%</span></p>
            </div>
            <div id="game-over-achievements" class="achievements-list">
                <!-- Unlocked achievements during this run -->
            </div>
            <button id="restart-btn" class="pixel-btn">RIPROVA</button>
        </div>
    </div>

    <!-- Script with cache busting -->
    <script src="game.js?v=2.5"></script>
</body>

</html>
